[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uap-infinite-time"
version = "0.1.0"
description = "Experiment code for universal approximation of dynamical systems with infinite-time horizon guarantees"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Abel Ságodi" },
    { name = "Il Memming Park" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["uap*"]
